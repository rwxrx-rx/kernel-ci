name: Build Manager

on:
  workflow_call:
    inputs:
      ksu_variant:
        required: true
        type: string

jobs:
  manager:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve manager repo for variant
        id: resolve
        run: |
          case "${{ inputs.ksu_variant }}" in
            kernelsu-next-legacy) REPO="https://github.com/KernelSU-Next/KernelSU-Next" ;;
            resukisu)              REPO="https://github.com/ReSukiSU/ReSukiSU" ;;
            sukisu-ultra)          REPO="https://github.com/SukiSU-Ultra/SukiSU-Ultra" ;;
            wildksu)                REPO="https://github.com/WildKernels/GKI_KernelSU_SUSFS" ;;
            xxksu)
              echo "::error::xxKSU manager repo not configured — set it in this job before using component=manager with xxksu"
              exit 1 ;;
            *) REPO="" ;;
          esac
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"

      # NOTE on ReSukiSU specifically: ReSukiSU does not publish GitHub
      # Releases at all (confirmed on their own releases page — "There
      # aren't any releases here" — and their install docs say to grab
      # the Manager via nightly.link or a GitHub Actions artifact
      # instead). Their own manager is also a non-trivial multi-module
      # Compose/Koin app. That means a plain `./gradlew assembleRelease`
      # here is a genuine best-effort, not a guaranteed build — if it
      # fails for resukisu specifically, that's the expected/documented
      # state of that project right now, not a bug in this workflow to
      # keep chasing. The other forks (KernelSU-Next, SukiSU Ultra,
      # WildKSU) ship simpler managers that build via plain Gradle fine.
      - name: Clone manager source
        if: steps.resolve.outputs.repo != ''
        run: git clone --depth=1 --recurse-submodules "${{ steps.resolve.outputs.repo }}" manager-src

      - name: Set up JDK
        if: steps.resolve.outputs.repo != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Locate and build manager APK
        if: steps.resolve.outputs.repo != ''
        run: |
          # Don't assume gradlew lives at the repo root — forks vary
          # (KernelSU-Next/SukiSU-Ultra keep it at root, but not every
          # fork does). Find whichever directory actually has it.
          GRADLE_FILE=$(find manager-src -maxdepth 4 -name gradlew | head -n1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "::error::No gradlew found anywhere under manager-src (up to 4 levels deep). This fork's manager may live in a separate repo — check ${{ steps.resolve.outputs.repo }} manually and update the REPO in this workflow's resolve step."
            find manager-src -maxdepth 2 -type d
            exit 1
          fi
          GRADLE_DIR=$(dirname "$GRADLE_FILE")
          echo "Found gradle project at $GRADLE_DIR"
          cd "$GRADLE_DIR"
          chmod +x gradlew

          # Try likely release task names first. `assembleRelease` on
          # most of these apps needs a signing config this CI doesn't
          # have — that's the single most common reason this step fails,
          # not a wrong task name — so after exhausting release
          # variants, fall back to assembleDebug (unsigned-but-installable,
          # good enough to test a build actually compiles).
          BUILD_OK=0
          for TASK in ":manager:assembleRelease" ":app:assembleRelease" "assembleRelease"; do
            echo "==> Trying ./gradlew $TASK"
            if ./gradlew "$TASK" --stacktrace; then
              BUILD_OK=1
              break
            fi
            echo "    $TASK failed, trying next..."
          done

          if [ "$BUILD_OK" = "0" ]; then
            echo "::warning::All assembleRelease variants failed (most likely: no signing config available in CI). Falling back to assembleDebug."
            for TASK in ":manager:assembleDebug" ":app:assembleDebug" "assembleDebug"; do
              echo "==> Trying ./gradlew $TASK"
              if ./gradlew "$TASK" --stacktrace; then
                BUILD_OK=1
                break
              fi
              echo "    $TASK failed, trying next..."
            done
          fi

          if [ "$BUILD_OK" = "0" ]; then
            echo "::error::Every release and debug assemble task failed for ${{ inputs.ksu_variant }}. This fork's manager likely needs project-specific setup (local.properties, a specific NDK/AGP version, submodules this checkout didn't pull, ...) beyond a bare 'git clone && gradlew build'. Check the -- stacktrace output above for the actual Gradle error."
            exit 1
          fi

      - name: Collect APK
        if: steps.resolve.outputs.repo != ''
        run: |
          mkdir -p manager-out
          # Release APKs preferred, but a debug fallback from the step
          # above is still worth keeping — collect both.
          find manager-src -name '*.apk' \( -path '*release*' -o -path '*debug*' \) -exec cp {} manager-out/ \;
          ls -la manager-out/ || true

      - uses: actions/upload-artifact@v4
        if: steps.resolve.outputs.repo != ''
        with:
          name: manager-${{ inputs.ksu_variant }}
          path: manager-out/*.apk
          if-no-files-found: warn
