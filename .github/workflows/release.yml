name: Publish Release

on:
  workflow_call:
    inputs:
      release_channel:
        required: true
        type: string
      run_id:
        required: true
        type: string
    secrets:
      TELEGRAM_BOT_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Flatten artifacts + merge changelogs
        id: gather
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -iname '*.zip' -o -iname '*.apk' \) -exec cp {} release-assets/ \;

          TAG="camellia-$(date +%Y%m%d-%H%M)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          {
            echo "# Camellia kernel build — $TAG"
            echo
            for f in artifacts/changelog-*/changelog.md; do
              [ -f "$f" ] && cat "$f" && echo
            done
          } > release-assets/../RELEASE_BODY.md

          # Shortest telegram changelog wins the message body; long-form
          # detail always lives in the GitHub Release itself.
          find artifacts -name changelog_telegram.txt | head -n1 | xargs -r cat > tg_message.txt || true
          [ -s tg_message.txt ] || echo "Camellia kernel build \`$TAG\`" > tg_message.txt

      - name: Create GitHub Release
        if: inputs.release_channel == 'github' || inputs.release_channel == 'both'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.gather.outputs.tag }}
          name: Camellia kernel — ${{ steps.gather.outputs.tag }}
          body_path: RELEASE_BODY.md
          files: release-assets/*
          draft: false
          prerelease: false

      - name: Push to Telegram
        if: inputs.release_channel == 'telegram' || inputs.release_channel == 'both'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          bash scripts/telegram_notify.sh tg_message.txt release-assets/*
