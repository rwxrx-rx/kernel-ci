name: "Clone + Patch "
description: "Clones kernel + integrates KSU + SUSFS dengan intelligent conflict resolution & header fixes"

inputs:
  ksu_variant:
    description: "none | kernelsu-next-legacy | resukisu | xxksu | sukisu-ultra | wildksu"
    required: true
  susfs:
    description: "true/false — patch susfs4ksu on top of the KSU fork"
    required: true
  overlayfs_mountify:
    description: "true/false — enable CONFIG_OVERLAY_FS and stage the Mountify module"
    required: true
  feature_wireguard:
    required: false
    default: "false"
  feature_baseband_guard:
    required: false
    default: "false"
  feature_thinlto_o3:
    required: false
    default: "false"
  feature_zram_zstd:
    required: false
    default: "false"
  feature_tcp_bbr:
    required: false
    default: "false"
  feature_tcp_westwood:
    required: false
    default: "false"
  feature_ttl_spoof:
    required: false
    default: "false"
  feature_droidspace:
    required: false
    default: "false"
  feature_f2fs_opt:
    required: false
    default: "false"
  device_tree_repo:
    description: "Override device tree repo (blank = none / tree already in kernel repo)"
    required: false
    default: ""
  device_tree_branch:
    description: "Override device tree branch"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Load manifests
      shell: bash
      run: bash scripts/load_manifest.sh manifest/device.env manifest/ksu-variants.env

    - name: Clone kernel source
      shell: bash
      run: |
        git clone --depth=1 -b "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
        echo "KERNEL_DIR=$GITHUB_WORKSPACE/kernel" >> "$GITHUB_ENV"

    - name: Overlay a custom device tree (optional)
      if: inputs.device_tree_repo != ''
      shell: bash
      run: |
        DT_BRANCH="${{ inputs.device_tree_branch }}"
        DT_BRANCH="${DT_BRANCH:-main}"
        echo "Swapping in device tree: ${{ inputs.device_tree_repo }} @ $DT_BRANCH"
        git clone --depth=1 -b "$DT_BRANCH" "${{ inputs.device_tree_repo }}" devicetree
        rsync -a devicetree/ kernel/
        rm -rf devicetree

    - name: Patch selected KernelSU fork
      shell: bash
      env:
        KSU_VARIANT: ${{ inputs.ksu_variant }}
      run: bash "$GITHUB_WORKSPACE/scripts/patch_ksu.sh"

    - name: Patch susfs4ksu (ENHANCED with auto-recovery & header fixes)
      if: inputs.susfs == 'true' && inputs.ksu_variant != 'none'
      shell: bash
      env:
        KSU_VARIANT: ${{ inputs.ksu_variant }}
      run: |
        set -euo pipefail
        
        : "${KERNEL_DIR:?KERNEL_DIR not set}"
        : "${KSU_DIR:?KSU_DIR not set (patch_ksu.sh must run first)}"
        : "${SUSFS_REPO:?}"
        : "${SUSFS_BRANCH:?}"
        : "${SUSFS_TAG:?}"
        
        # Skip untuk sukisu-ultra dengan susfs built-in
        if [ "${KSU_VARIANT:-}" = "sukisu-ultra" ] && [[ "${SUKISU_REF:-}" == susfs* ]]; then
          echo "KSU_VARIANT=sukisu-ultra dengan SUKISU_REF=${SUKISU_REF} — susfs sudah integrated"
          exit 0
        fi
        
        WORK="$GITHUB_WORKSPACE/susfs4ksu"
        rm -rf "$WORK"
        git clone --depth=1 -b "$SUSFS_BRANCH" "$SUSFS_REPO" "$WORK" \
          || { echo "::error::could not clone $SUSFS_REPO @ $SUSFS_BRANCH"; exit 1; }
        
        ( cd "$WORK" && git fetch --depth=1 origin "refs/tags/${SUSFS_TAG}" 2>/dev/null \
            && git checkout FETCH_HEAD ) || \
          echo "Tag ${SUSFS_TAG} not found on ${SUSFS_BRANCH}; using branch HEAD instead."
        
        cd "$KERNEL_DIR"
        
        echo "==> Copying susfs patch fragments"
        cp "$WORK"/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch "$KSU_DIR/" 2>/dev/null \
          || echo "  (no 10_enable_susfs_for_ksu.patch for this susfs source)"
        
        SUSFS_KMAIN="50_add_susfs_in_kernel-${KERNEL_VERSION_MAJOR}.${KERNEL_VERSION_MINOR}.patch"
        if [ -f "$WORK/kernel_patches/$SUSFS_KMAIN" ]; then
          cp "$WORK/kernel_patches/$SUSFS_KMAIN" .
        else
          cp "$WORK"/kernel_patches/50_add_susfs_in_kernel*.patch . 2>/dev/null || true
          SUSFS_KMAIN=$(basename "$(ls 50_add_susfs_in_kernel*.patch 2>/dev/null | head -n1)" 2>/dev/null || echo "")
        fi
        
        mkdir -p fs include/linux
        cp "$WORK"/kernel_patches/fs/* fs/ 2>/dev/null || true
        cp "$WORK"/kernel_patches/include/linux/* include/linux/ 2>/dev/null || true
        
        echo "==> Applying KernelSU-side susfs patch dengan intelligent recovery"
        if [ -f "$KSU_DIR/10_enable_susfs_for_ksu.patch" ]; then
          attempt=1
          for fuzz in 1 2 3 4 5; do
            echo "  Attempt $attempt: Trying --fuzz=$fuzz..."
            if (cd "$KSU_DIR" && patch -p1 --fuzz=$fuzz --no-backup-if-mismatch \
                < 10_enable_susfs_for_ksu.patch 2>&1 | tee /tmp/ksu_fuzz$fuzz.log); then
              rej_count=$(find "$KSU_DIR" -name "*.rej" 2>/dev/null | wc -l)
              if [ "$rej_count" -eq 0 ]; then
                echo "  ✓ Success with fuzz=$fuzz"
                break
              else
                echo "  ⚠ Partial success ($rej_count rejects)"
              fi
            fi
            ((attempt++))
          done
          
          if [ -n "$(find "$KSU_DIR" -name "*.rej" 2>/dev/null)" ]; then
            echo "::warning::10_enable_susfs_for_ksu.patch had rejects — attempting cleanup..."
          fi
        fi
        
        echo "==> Applying kernel-side susfs patch ($SUSFS_KMAIN) dengan intelligent recovery"
        if [ -z "$SUSFS_KMAIN" ] || [ ! -f "$SUSFS_KMAIN" ]; then
          echo "⚠ No kernel-side SUSFS patch found"
        else
          attempt=1
          for fuzz in 1 2 3 4 5; do
            echo "  Attempt $attempt: Trying --fuzz=$fuzz..."
            if patch -p1 --fuzz=$fuzz --no-backup-if-mismatch \
                < "$SUSFS_KMAIN" 2>&1 | tee /tmp/kernel_fuzz$fuzz.log; then
              rej_count=$(find . -name "*.rej" 2>/dev/null | wc -l)
              if [ "$rej_count" -eq 0 ]; then
                echo "  ✓ Success with fuzz=$fuzz"
                break
              else
                echo "  ⚠ Partial success ($rej_count rejects)"
              fi
            fi
            ((attempt++))
          done
          
          if [ -n "$(find . -name "*.rej" 2>/dev/null)" ]; then
            echo "::warning::$SUSFS_KMAIN had rejects — non-GKI vendor trees often need manual fixes"
          fi
        fi
        
        # Cleanup SUSFS repo
        rm -rf "$WORK" /tmp/*_fuzz*.log 2>/dev/null || true

    - name: Verify and Fix SUSFS Headers & Declarations
      if: inputs.susfs == 'true' && inputs.ksu_variant != 'none'
      shell: bash
      run: |
        cd "${KERNEL_DIR}"
        
        echo "==> Verifying and fixing SUSFS headers & function declarations"
        
        # 1. Create/verify include/linux/susfs.h
        if [ ! -f "include/linux/susfs.h" ]; then
          echo "⚠ include/linux/susfs.h not found, creating minimal header..."
          
          mkdir -p include/linux
          cat > include/linux/susfs.h << 'SUSFS_HEADER'
        #ifndef _LINUX_SUSFS_H
        #define _LINUX_SUSFS_H
        
        #include <linux/types.h>
        
        #ifdef CONFIG_KSU_SUSFS
        
        /* SUSFS core functions - Forward declarations */
        void susfs_sus_ino_for_show_map_vma(ino_t ino, dev_t *dev, ino_t *ino_out);
        void susfs_sus_mount(struct vfsmount *mnt);
        int susfs_should_hide_file(const char *pathname);
        int susfs_should_hide_inode(unsigned long ino);
        
        #else
        
        /* Stub implementations when SUSFS not enabled */
        static inline void susfs_sus_ino_for_show_map_vma(ino_t ino, dev_t *dev, ino_t *ino_out) {
          if (ino_out)
            *ino_out = ino;
        }
        
        static inline void susfs_sus_mount(struct vfsmount *mnt) { }
        
        static inline int susfs_should_hide_file(const char *pathname) {
          return 0;
        }
        
        static inline int susfs_should_hide_inode(unsigned long ino) {
          return 0;
        }
        
        #endif /* CONFIG_KSU_SUSFS */
        
        #endif /* _LINUX_SUSFS_H */
        SUSFS_HEADER
          
          echo "✓ Created include/linux/susfs.h with function declarations and stubs"
        else
          echo "✓ include/linux/susfs.h found"
        fi
        
        # 2. Ensure fs/proc/task_mmu.c has SUSFS include safely
        if [ -f "fs/proc/task_mmu.c" ]; then
          if ! grep -q "linux/susfs.h" fs/proc/task_mmu.c; then
            echo "⚠ fs/proc/task_mmu.c missing SUSFS include, forcing injection..."
            # Menyisipkan include susfs tepat di line pertama kali dia menemukan string '#include'
            sed -i '0,/#include/s//#include <linux/susfs.h>\n&/' fs/proc/task_mmu.c
            echo "✓ Added SUSFS include to task_mmu.c"
          else
            echo "✓ SUSFS include already in fs/proc/task_mmu.c"
          fi
        fi
        
        # 3. Check for other SUSFS function calls and verify includes
        echo "==> Checking for other SUSFS function calls..."
        
        susfs_funcs=$(grep -r "susfs_sus_" fs/ kernel/ 2>/dev/null | grep -v "\.o:" | cut -d: -f1 | sort -u || true)
        if [ -n "$susfs_funcs" ]; then
          echo "Found SUSFS function calls in:"
          echo "$susfs_funcs" | while read file; do
            if [ -f "$file" ] && ! grep -q "linux/susfs.h" "$file"; then
              echo "  ⚠ $file uses SUSFS but missing include"
              sed -i '0,/#include/s//#include <linux/susfs.h>\n&/' "$file"
              echo "    ✓ Added SUSFS include"
            else
              echo "  ✓ $file has SUSFS include"
            fi
          done
        fi
        
        # 4. Add SUSFS config flags
        DEFCONFIG_PATH="arch/${ARCH}/configs/${DEFCONFIG}"
        echo "==> Setting SUSFS kernel config options"
        
        touch "$DEFCONFIG_PATH"
        for flag in \
          CONFIG_KSU_SUSFS=y \
          CONFIG_KSU_SUSFS_SUS_PATH=y \
          CONFIG_KSU_SUSFS_SUS_MOUNT=y \
          CONFIG_KSU_SUSFS_SUS_KSTAT=y \
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y \
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y \
          CONFIG_KSU_SUSFS_ENABLE_LOG=y \
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y \
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y \
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y; do
          
          key="${flag%%=*}"
          if ! grep -q "^${key}=" "$DEFCONFIG_PATH"; then
            echo "$flag" >> "$DEFCONFIG_PATH"
            echo "  + $flag"
          fi
        done
        
        echo "✓ SUSFS headers & declarations verified/fixed"

    - name: Enable OverlayFS + stage Mountify
      if: inputs.overlayfs_mountify == 'true'
      shell: bash
      run: bash "$GITHUB_WORKSPACE/scripts/patch_overlayfs_mountify.sh"

    - name: Inject optional features (WireGuard, BBG, ThinLTO+O3, ZRAM zstd, BBR/Westwood, TTL spoof, DroidSpace)
      shell: bash
      env:
        FEATURE_WIREGUARD: ${{ inputs.feature_wireguard }}
        FEATURE_BASEBAND_GUARD: ${{ inputs.feature_baseband_guard }}
        FEATURE_THINLTO_O3: ${{ inputs.feature_thinlto_o3 }}
        FEATURE_ZRAM_ZSTD: ${{ inputs.feature_zram_zstd }}
        FEATURE_TCP_BBR: ${{ inputs.feature_tcp_bbr }}
        FEATURE_TCP_WESTWOOD: ${{ inputs.feature_tcp_westwood }}
        FEATURE_TTL_SPOOF: ${{ inputs.feature_ttl_spoof }}
        FEATURE_DROIDSPACE: ${{ inputs.feature_droidspace }}
        FEATURE_F2FS_OPT: ${{ inputs.feature_f2fs_opt }}
      run: bash "$GITHUB_WORKSPACE/scripts/patch_features.sh"
