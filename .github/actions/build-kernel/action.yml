name: "Build Kernel"
description: "Runs make olddefconfig + make with the resolved clang toolchain"

inputs:
  clang:
    required: true
  jobs:
    required: false
    default: "$(nproc --all)"

runs:
  using: "composite"
  steps:
    - name: Load device manifest
      shell: bash
      run: bash scripts/load_manifest.sh manifest/device.env

    - name: Build
      shell: bash
      env:
        CLANG_FLAVOR: ${{ inputs.clang }}
      run: |
        cd "$KERNEL_DIR"
        DEFCONFIG_PATH="arch/${ARCH}/configs/${DEFCONFIG}"

        if [ -f "drivers/kernelsu/sulog/event.c" ]; then
          sed -i 's/get_monotonic_boottime(&ts)/ktime_get_boottime_ts64(\&ts)/g' drivers/kernelsu/sulog/event.c
        fi

        rm -rf drivers/net/wireguard net/wireguard /tmp/wireguard
        sed -i '/wireguard/d' drivers/net/Kconfig 2>/dev/null || true
        sed -i '/wireguard/d' drivers/net/Makefile 2>/dev/null || true
        sed -i '/wireguard/d' net/Kconfig 2>/dev/null || true
        sed -i '/wireguard/d' net/Makefile 2>/dev/null || true

        git clone --depth=1 https://github.com/WireGuard/wireguard-linux-compat.git /tmp/wireguard
        cp -r /tmp/wireguard/src net/wireguard

        if [ -f "include/uapi/linux/time_types.h" ]; then
          if [ -f "net/wireguard/compat/compat.h" ]; then
            sed -i '/struct __kernel_timespec {/,/};/s/^/\/\//' net/wireguard/compat/compat.h
          fi
        fi

        sed -i '/endmenu/i source "net/wireguard/Kconfig"' net/Kconfig || echo 'source "net/wireguard/Kconfig"' >> net/Kconfig
        echo 'obj-$(CONFIG_WIREGUARD) += wireguard/' >> net/Makefile
        rm -rf /tmp/wireguard

        if [ -f "$DEFCONFIG_PATH" ]; then
          sed -i "/^#\? *CONFIG_WIREGUARD[ =]/d" "$DEFCONFIG_PATH"
          echo "CONFIG_WIREGUARD=y" >> "$DEFCONFIG_PATH"
        fi

        MAKE_ARGS=(
          ARCH="$ARCH"
          O=out
          CC=clang
          LD=ld.lld
          CLANG_TRIPLE=aarch64-linux-gnu-
          CROSS_COMPILE=aarch64-linux-android-
          CROSS_COMPILE_ARM32=arm-linux-androideabi-
          LLVM=1
          LLVM_IAS=1
        )

        make "${MAKE_ARGS[@]}" "$DEFCONFIG"
        make "${MAKE_ARGS[@]}" -j"${{ inputs.jobs }}" 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

        IMG="out/arch/${ARCH}/boot/Image.gz-dtb"
        [ -f "$IMG" ] || IMG="out/arch/${ARCH}/boot/Image.gz"
        [ -f "$IMG" ] || IMG="out/arch/${ARCH}/boot/Image"
        if [ ! -f "$IMG" ]; then
          echo "::error::No kernel Image found under out/arch/${ARCH}/boot/ — check build.log"
          exit 1
        fi
        mkdir -p "$GITHUB_WORKSPACE/out"
        cp "$IMG" "$GITHUB_WORKSPACE/out/Image"
        find out/arch/"$ARCH"/boot -name '*.dtb' -exec cp {} "$GITHUB_WORKSPACE/out/" \; || true
        find out/arch/"$ARCH"/boot -name '*dtbo*.img' -exec cp {} "$GITHUB_WORKSPACE/out/" \; || true

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log-${{ inputs.clang }}
        path: build.log
        retention-days: 7
